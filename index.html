<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="pomodoro">
    <h1>Pomodoro</h1>
    <div id="phase" class="phase">Work</div>
    <div id="time" class="time">25:00</div>
    <div class="controls">
      <button id="start">Start</button>
      <button id="pause">Pause</button>
      <button id="reset">Reset</button>
    </div>
    <div class="durations">
      <label>Work (min): <input type="number" id="work-minutes" min="1" max="120" value="25"></label>
      <label>Break (min): <input type="number" id="break-minutes" min="1" max="60" value="5"></label>
    </div>
    <div class="tally">Sessions: <span id="sessions">0</span></div>
  </main>
  <script src="app.js"></script>
  <script src="main.js"></script>
</body>
</html>
